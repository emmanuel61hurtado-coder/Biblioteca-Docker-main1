name: CI Workflow - Biblioteca Docker

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'app/requirements.txt'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest --verbose --tb=short

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: biblioteca-app:latest

      - name: Validate Docker Compose
        run: |
          docker compose config
